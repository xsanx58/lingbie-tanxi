<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>临别叹息 · 丧尸末世生存模拟</title>
<style>
  :root{
    --bg:#0a0d0c;
    --panel:#111714;
    --panel2:#171f1b;
    --line:#25322c;
    --text:#cbd5cf;
    --dim:#7f8c85;
    --accent:#c94f3d;
    --accent2:#e07a5f;
    --good:#4f9d69;
    --warn:#c9a227;
    --bad:#c94f3d;
    --info:#4a7ea8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    font-size:14px;
    line-height:1.55;
    min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  .hidden{display:none !important;}

  /* ============ 标题/开局界面 ============ */
  #titleScreen{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 16px;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(201,79,61,.18), transparent 60%),
      radial-gradient(900px 600px at 90% 110%, rgba(74,126,168,.12), transparent 60%),
      linear-gradient(180deg,#0b0f0d,#070908);
    position:relative;overflow:hidden;
  }
  #titleScreen::before{
    content:"☣";position:absolute;right:6%;top:8%;font-size:120px;opacity:.05;transform:rotate(12deg);
  }
  .hero{text-align:center;margin-bottom:22px;}
  .hero .kicker{letter-spacing:.35em;color:var(--dim);font-size:12px;margin-bottom:8px;}
  .hero h1{
    margin:0;font-size:52px;font-weight:700;letter-spacing:.12em;color:#e8edea;
    text-shadow:0 0 28px rgba(201,79,61,.35);
  }
  .hero .sub{margin:10px 0 0;color:var(--dim);letter-spacing:.08em;}
  .hero .quote{margin:14px auto 0;max-width:640px;color:#8fa098;font-style:italic;font-size:13px;}

  .creation-card{
    width:100%;max-width:880px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:22px 26px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .creation-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.wide{grid-column:1 / -1;}
  .field label{color:var(--dim);font-size:12px;letter-spacing:.06em;}
  .field input,.field select{
    background:var(--panel2);border:1px solid var(--line);border-radius:7px;
    color:var(--text);padding:9px 10px;outline:none;width:100%;
  }
  .field input:focus,.field select:focus{border-color:var(--accent);}
  .field .hint{color:var(--dim);font-size:12px;min-height:16px;}
  .creation-actions{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
  .btn{
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:10px 18px;font-size:14px;transition:all .15s;
  }
  .btn:hover{border-color:var(--accent);color:#fff;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .btn.primary:hover{background:var(--accent2);}
  .btn.ghost{background:transparent;}
  .btn.small{padding:5px 10px;font-size:12px;border-radius:6px;}
  .btn.danger{border-color:#6d3328;color:#e08d7d;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* ============ 游戏界面 ============ */
  #gameScreen{min-height:100vh;display:flex;flex-direction:column;}
  #topBar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px 16px;background:#0d120f;border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  #topBar .brand{font-weight:700;letter-spacing:.12em;color:#e0e6e2;font-size:16px;}
  #topBar .brand span{color:var(--accent);}
  .chip{
    display:inline-flex;align-items:center;gap:5px;
    background:var(--panel2);border:1px solid var(--line);border-radius:999px;
    padding:4px 11px;font-size:12px;color:#aeb9b2;white-space:nowrap;
  }
  .chip b{color:var(--text);font-weight:600;}
  .chip.warn{border-color:#5a4a1d;color:#e0c56d;}
  .chip.danger{border-color:#6d3328;color:#e08d7d;}
  .spacer{flex:1;}

  .layout{display:grid;grid-template-columns:272px 1fr 300px;gap:0;flex:1;min-height:0;}
  .panel{
    background:var(--panel);border-right:1px solid var(--line);
    padding:14px;overflow-y:auto;
  }
  .panel h2{
    margin:0 0 10px;font-size:13px;color:var(--dim);letter-spacing:.15em;font-weight:600;
    border-bottom:1px solid var(--line);padding-bottom:8px;
  }

  /* 状态栏 */
  #statusPanel{grid-column:1;}
  .who{margin-bottom:12px;}
  .who .name{font-size:19px;font-weight:700;color:#eef2ef;}
  .who .meta{color:var(--dim);font-size:12px;margin-top:2px;}
  .bar-row{margin-bottom:8px;}
  .bar-row .lbl{display:flex;justify-content:space-between;font-size:12px;color:#a7b2ab;margin-bottom:3px;}
  .bar-row .lbl .v{color:var(--dim);}
  .bar{height:7px;background:#0c110e;border:1px solid var(--line);border-radius:99px;overflow:hidden;}
  .bar .fill{height:100%;border-radius:99px;transition:width .25s;}
  .fill.hp{background:linear-gradient(90deg,#8f2f26,#d75b49);}
  .fill.st{background:linear-gradient(90deg,#2c5f43,#58b076);}
  .fill.need{background:linear-gradient(90deg,#7a5b1d,#d3a234);}
  .fill.bad{background:linear-gradient(90deg,#5a2430,#b23a4f);}
  .fill.mid{background:linear-gradient(90deg,#33536e,#5f93bd);}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0;}
  .stat-cell{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:11.5px;}
  .stat-cell .k{color:var(--dim);}
  .stat-cell .v{font-size:13px;font-weight:600;color:#dbe3de;word-break:break-all;}
  .badge{
    display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;
    background:#2a1c19;color:var(--accent2);border:1px solid #5a2c24;
  }
  .badge.ok{background:#18261d;color:#7fc79a;border-color:#2d533a;}
  .badge.warnb{background:#292311;color:#e0c56d;border-color:#5a4a1d;}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
  .tag{background:#1b2520;border:1px solid var(--line);color:#9faea6;border-radius:5px;padding:1px 7px;font-size:11px;}
  .ability-card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-top:10px;}
  .ability-card .t{font-weight:600;color:#e0c56d;font-size:13px;}
  .ability-card .d{color:var(--dim);font-size:12px;margin-top:3px;}

  /* 中央区域 */
  #mainPanel{grid-column:2;padding:0;display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0;}
  #tabs{display:flex;gap:2px;padding:8px 12px 0;background:#0d120f;border-bottom:1px solid var(--line);overflow-x:auto;}
  .tab{
    background:transparent;border:1px solid transparent;border-bottom:none;color:var(--dim);
    padding:9px 16px;font-size:14px;border-radius:8px 8px 0 0;
  }
  .tab:hover{color:var(--text);}
  .tab.active{background:var(--panel);border-color:var(--line);color:#eef2ef;font-weight:600;}
  #tabContent{flex:1;overflow-y:auto;padding:16px;background:var(--panel);}
  .view-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .view-head h3{margin:0;font-size:18px;color:#e5ebe7;}
  .view-head .sub{color:var(--dim);font-size:12px;}

  .action-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
  .action-card{
    background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    padding:12px;text-align:left;color:var(--text);transition:all .15s;
  }
  .action-card:hover{border-color:var(--accent);transform:translateY(-1px);}
  .action-card .t{font-weight:600;font-size:14px;color:#e6ece8;margin-bottom:4px;display:flex;gap:6px;align-items:center;}
  .action-card .d{font-size:12px;color:var(--dim);}
  .action-card .cost{font-size:11px;color:var(--warn);margin-top:5px;}

  .card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:12px;}
  .card .card-title{font-weight:600;color:#e6ece8;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #1e2a24;font-size:13px;}
  .row:last-child{border-bottom:none;}
  .row .k{color:var(--dim);}
  .row .v{color:#dbe3de;text-align:right;}
  .loc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
  .loc-card{
    background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px;
    display:flex;flex-direction:column;gap:6px;
  }
  .loc-card .n{font-weight:600;color:#e6ece8;display:flex;justify-content:space-between;gap:6px;}
  .loc-card .info{font-size:12px;color:var(--dim);}
  .loc-card .foot{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:4px;}
  .danger-dots{display:flex;gap:3px;align-items:center;}
  .dot{width:8px;height:8px;border-radius:50%;background:#223028;}
  .dot.on{background:var(--accent);}

  .item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;}
  .item{
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    display:flex;flex-direction:column;gap:4px;
  }
  .item .top{display:flex;justify-content:space-between;align-items:center;}
  .item .nm{font-weight:600;color:#e6ece8;font-size:13px;}
  .item .qty{color:var(--warn);font-size:13px;}
  .item .desc{font-size:11px;color:var(--dim);min-height:14px;}
  .item .acts{display:flex;gap:5px;flex-wrap:wrap;}
  .inv-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  .inv-head .cap{color:var(--dim);font-size:12px;}
  .discard-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .discard-row select,.discard-row input{
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    color:var(--text);padding:6px 8px;font-size:13px;outline:none;min-width:0;
  }
  .discard-row select{flex:1;}
  .discard-row input{width:90px;}
  .discard-row select:focus,.discard-row input:focus{border-color:var(--accent);}

  .facility{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed #1e2a24;}
  .facility:last-child{border-bottom:none;}
  .facility .n{font-weight:600;color:#e6ece8;}
  .facility .d{font-size:12px;color:var(--dim);}
  .facility .req{font-size:11px;color:var(--warn);}
  .resource-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:12px;}
  .res{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;}
  .res .k{font-size:11px;color:var(--dim);}
  .res .v{font-size:17px;font-weight:700;color:#e6ece8;}

  .npc{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed #1e2a24;}
  .npc:last-child{border-bottom:none;}
  .npc .avatar{
    width:38px;height:38px;border-radius:50%;background:#1c2a23;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
  }
  .npc .body{flex:1;min-width:0;}
  .npc .n{font-weight:600;color:#e6ece8;display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
  .npc .m{font-size:12px;color:var(--dim);margin:2px 0 5px;}
  .npc select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 6px;font-size:12px;}

  /* 日志 */
  #logSide{grid-column:3;border-right:none;}
  #logBox{display:flex;flex-direction:column;gap:7px;}
  .log-item{font-size:12.5px;border-left:3px solid var(--line);padding:3px 8px;color:#9aa69f;}
  .log-item .t{color:var(--dim);font-size:11px;margin-right:6px;}
  .log-item.info{border-color:var(--info);color:#b9c8d3;}
  .log-item.good{border-color:var(--good);color:#a8cdb4;}
  .log-item.bad{border-color:var(--bad);color:#d6a096;}
  .log-item.warn{border-color:var(--warn);color:#d8c48a;}
  .log-item.sys{border-color:#7a5f9e;color:#c3aed8;}

  /* 弹窗 */
  #modalOverlay{
    position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  #modal{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    width:100%;max-width:640px;max-height:86vh;display:flex;flex-direction:column;
    box-shadow:0 30px 80px rgba(0,0,0,.7);
  }
  #modalHead{
    padding:14px 18px;border-bottom:1px solid var(--line);
    font-weight:700;color:#eef2ef;font-size:16px;letter-spacing:.04em;
    display:flex;justify-content:space-between;align-items:center;
  }
  #modalHead .close{background:none;border:none;color:var(--dim);font-size:20px;padding:0 4px;}
  #modalHead .close:hover{color:#fff;}
  #modalBody{padding:16px 18px;overflow-y:auto;}
  #modalBody{scrollbar-width:thin;scrollbar-color:#40544a #121815;}
  #modalBody::-webkit-scrollbar{width:10px;}
  #modalBody::-webkit-scrollbar-track{background:#121815;}
  #modalBody::-webkit-scrollbar-thumb{background:#40544a;border-radius:6px;border:2px solid #121815;}
  #modalBody::-webkit-scrollbar-thumb:hover{background:#54695e;}
  #modalFoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end;}
  .battle{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
  .battle-side{background:#0c110e;border:1px solid var(--line);border-radius:9px;padding:10px;}
  .battle-title{font-weight:600;color:#e6ece8;font-size:13px;margin-bottom:8px;}
  .mob{margin-bottom:7px;}
  .mob-top{display:flex;justify-content:space-between;font-size:12.5px;color:#cbd5cf;margin-bottom:3px;}
  .battle-feed{grid-column:1 / -1;background:#0c110e;border:1px solid var(--line);border-radius:9px;padding:8px 10px;max-height:112px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;}
  .battle-line{font-size:12px;}
  .battle-line.good{color:#a8cdb4;}
  .battle-line.bad{color:#d6a096;}
  .battle-line.warn{color:#d8c48a;}
  .battle-line.info{color:#9aa69f;}
  .battle-line.sys{color:#c3aed8;}
  .narrative{color:#c6cfca;font-size:14px;white-space:pre-wrap;}
  .narrative p{margin:0 0 10px;}
  .narrative p:last-child{margin-bottom:0;}
  .choice-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .choice{
    text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:10px 12px;
  }
  .choice:hover{border-color:var(--accent);}
  .choice .t{font-weight:600;color:#e6ece8;}
  .choice .d{display:block;font-size:12px;color:var(--dim);margin-top:2px;}

  #toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:#1a231e;border:1px solid var(--line);border-radius:8px;
    padding:9px 16px;color:var(--text);z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.5);
    transition:opacity .2s;
  }

  @media (max-width:1080px){
    .layout{grid-template-columns:1fr;}
    #statusPanel,#mainPanel,#logSide{grid-column:1;}
    #statusPanel{border-bottom:1px solid var(--line);border-right:none;}
    #mainPanel{border-right:none;}
    #logSide{border-top:1px solid var(--line);}
  }
  @media (max-width:640px){
    .battle{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<!-- ==================== 标题与角色创建 ==================== -->
<div id="titleScreen">
  <div class="hero">
    <div class="kicker">超高自由度 · 丧尸末世 · 生存模拟</div>
    <h1>临别叹息</h1>
    <p class="sub">文明已经崩塌，但世界还没有停止运转。</p>
    <p class="quote">“如果世界真的突然变成这样，我能活多久？我会变成什么样的人？”</p>
  </div>
  <div class="creation-card">
    <div class="creation-grid">
      <div class="field">
        <label>姓名</label>
        <input id="cName" type="text" placeholder="你的名字" maxlength="12">
      </div>
      <div class="field">
        <label>性别</label>
        <select id="cSex">
          <option value="男" selected>男</option>
          <option value="女">女</option>
        </select>
      </div>
      <div class="field">
        <label>年龄</label>
        <input id="cAge" type="number" min="14" max="80" value="27">
      </div>
      <div class="field">
        <label>末日前职业</label>
        <select id="cProfession"></select>
      </div>
      <div class="field wide">
        <label>职业说明</label>
        <div class="hint" id="cProfessionHint"></div>
      </div>
      <div class="field">
        <label>身体状况</label>
        <select id="cBody">
          <option value="good">健康</option>
          <option value="normal" selected>一般</option>
          <option value="weak">体弱多病</option>
        </select>
        <div class="hint">影响初始生命、体力与免疫力</div>
      </div>
      <div class="field">
        <label>开局时间</label>
        <select id="cStart">
          <option value="-3">爆发前 72 小时（仍处于正常世界）</option>
          <option value="1" selected>爆发当天（秩序刚刚崩塌）</option>
          <option value="3">爆发第 3 天（城市开始混乱）</option>
          <option value="30">爆发第 30 天（社会大幅瓦解）</option>
          <option value="365">爆发第 1 年（文明进入新阶段）</option>
        </select>
        <div class="hint">越靠后开局，世界越危险、物资越匮乏</div>
      </div>
      <div class="field">
        <label>开局资源</label>
        <select id="cSupply">
          <option value="poor">极度普通</option>
          <option value="normal" selected>普通</option>
          <option value="prepared">略有准备</option>
          <option value="rich">高度准备</option>
        </select>
        <div class="hint">影响初始物资与现金</div>
      </div>
      <div class="field">
        <label>异能</label>
        <select id="cAbility">
          <option value="none" selected>没有异能（普通人）</option>
          <option value="latent">尚未觉醒（生死之间可能觉醒）</option>
          <option value="awakened">已经觉醒（自己选择能力）</option>
          <option value="random">随机（立刻随机觉醒一种）</option>
        </select>
        <div class="hint">异能者极其稀有，但强大的能力必有代价</div>
      </div>
      <div class="field hidden" id="cAbilityTypeField">
        <label>异能类型</label>
        <select id="cAbilityType"></select>
      </div>
      <div class="field">
        <label>死亡模式</label>
        <select id="cDeath">
          <option value="permadeath" selected>真实死亡（不可回档）</option>
          <option value="forgiving">轻度模拟（死亡后可回到当天清晨）</option>
        </select>
      </div>
    </div>
    <div class="creation-actions">
      <button class="btn ghost" id="randomBtn">🎲 随机人生</button>
      <button class="btn primary" id="startBtn">☣ 进入末世</button>
      <button class="btn hidden" id="loadBtn">继续上次的人生</button>
    </div>
  </div>
</div>

<!-- ==================== 游戏主界面 ==================== -->
<div id="gameScreen" class="hidden">
  <div id="topBar">
    <div class="brand">临别<span>叹息</span></div>
    <div class="chip">📅 <b id="hudDay"></b></div>
    <div class="chip">🕐 <b id="hudPhase"></b></div>
    <div class="chip">🌦 <b id="hudWeather"></b></div>
    <div class="chip">🗺 <b id="hudLocation"></b></div>
    <div class="chip warn" id="hudStageChip">⚙ <b id="hudStage"></b></div>
    <div class="spacer"></div>
    <button class="btn small" id="soundBtn" title="环境音效">🔇 音效关</button>
    <button class="btn small" id="cheatBtn" title="内置修改器">🛠 修改器</button>
    <button class="btn small" id="helpBtn">玩法说明</button>
    <button class="btn small" id="menuBtn">存档 / 菜单</button>
  </div>

  <div class="layout">
    <aside id="statusPanel" class="panel"></aside>
    <main id="mainPanel">
      <nav id="tabs">
        <button class="tab active" data-view="actions">行动</button>
        <button class="tab" data-view="map">地图</button>
        <button class="tab" data-view="inventory">背包</button>
        <button class="tab" data-view="base">基地</button>
        <button class="tab" data-view="team">团队</button>
        <button class="tab" data-view="log">日志</button>
      </nav>
      <div id="tabContent"></div>
    </main>
    <aside id="logSide" class="panel">
      <h2>最近动态</h2>
      <div id="logBox"></div>
    </aside>
  </div>
</div>

<div id="modalOverlay" class="hidden">
  <div id="modal">
    <div id="modalHead">
      <span id="modalTitle"></span>
      <button class="close" id="modalClose">×</button>
    </div>
    <div id="modalBody"></div>
    <div id="modalFoot"></div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script src="game.js"></script>
</body>
</html>
